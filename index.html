<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Business Cards</title>
<style>
  :root { --dark:#1f398e; --accent:#00adef; --bg:#eef1f6; --card:#fff; --text:#1a1d23; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --card:#181c23; --text:#eef0f3; } }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--dark); color:#fff; padding:22px 16px; text-align:center; }
  header h1 { margin:0; font-size:20px; }
  main { max-width:900px; margin:0 auto; padding:18px 14px 40px; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
  .tile { background:var(--card); border-radius:14px; overflow:hidden; text-decoration:none;
          color:var(--text); box-shadow:0 4px 16px rgba(0,0,0,.1); }
  .tile img { width:100%; display:block; }
  .tile div { padding:10px 12px; font-weight:600; }
  .view { max-width:560px; margin:0 auto; text-align:center; }
  .view img.card { width:100%; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.2); }
  .btn { display:block; width:100%; box-sizing:border-box; margin:10px 0; padding:13px; border-radius:12px; border:0; cursor:pointer;
         font:600 15px system-ui; text-decoration:none; background:var(--dark); color:#fff; }
  .btn.alt { background:var(--accent); }
  .btn.ghost { background:var(--card); color:var(--text); }
  .qr { background:#fff; border-radius:14px; padding:14px; display:inline-block; margin-top:6px; }
  .qr img { width:220px; height:220px; display:block; }
  h2 { margin:22px 0 6px; font-size:16px; }
</style></head>
<body>
<header><h1 id="title"></h1></header>
<main id="app"></main>

<script src="qrcode.js"></script>
<script>
// =====================================================================
//  Card List
// =====================================================================
const SITE_TITLE = "NHBRC Digital Business Cards";
const CARDS = [
  { name: "Craig Makapela", file: "cards/Craig Makapela.jpg"},
  { name: "Bongani Monareng", file: "cards/Bongani Monareng.jpg"},
  { name: "Millicent Kabwe", file: "cards/Millicent Kabwe.jpg"},
  { name: "Sibongile Ngwenya", file: "cards/Sibongile Ngwenya.jpg"},
  { name: "Sicelo Thuketane", file: "cards/Sicelo Thuketane.jpg" },
  { name: "Siyabonga Dyosiba", file: "cards/Siyabonga Dyosiba.jpg" },
  { name: "Taf Kachara", file: "cards/Taf Kachara.jpg"},
  { name: "Tamlyn Bouwer", file: "cards/Tamlyn Bouwer.jpg"},
  { name: "Abraham Chauke", file: "cards/Abraham Chauke.jpg"},
];

// =====================================================================
// FYI
// =====================================================================
document.getElementById("title").textContent = SITE_TITLE;
const app = document.getElementById("app");
const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const baseUrl = () => location.href.split("#")[0];

function qrImage(url) {            // makes a QR picture from any link
  const qr = qrcode(0, "M"); qr.addData(url); qr.make();
  return qr.createDataURL(8, 4);
}

function showHome() {
  const teamQr = qrImage(baseUrl());
  app.innerHTML = `<div class="grid">${CARDS.map(c =>
    `<a class="tile" href="#${slug(c.name)}"><img src="${c.file}" alt="${c.name}"><div>${c.name}</div></a>`
  ).join("")}</div>
  <div class="view"><h2>QR code for this whole page</h2>
    <div class="qr"><img src="${teamQr}" alt="QR code"></div>
    <a class="btn ghost" href="${teamQr}" download="team-qr.png">Download QR</a></div>`;
}

function showCard(c) {
  const url = baseUrl() + "#" + slug(c.name), qr = qrImage(url);
  app.innerHTML = `<div class="view">
    <img class="card" src="${c.file}" alt="${c.name}">
    <a class="btn" href="${c.file}" download>Download card image</a>
    <button class="btn alt" id="copy">Copy link</button>
    <h2>Scan to open this card</h2>
    <div class="qr"><img src="${qr}" alt="QR code"></div>
    <a class="btn ghost" href="${qr}" download="${slug(c.name)}-qr.png">Download QR for printing</a>
    <a class="btn ghost" href="#">All cards</a></div>`;
  document.getElementById("copy").onclick = e => {
    navigator.clipboard.writeText(url); e.target.textContent = "Copied!";
  };
}

function route() {
  const c = CARDS.find(c => slug(c.name) === decodeURIComponent(location.hash.slice(1)));
  c ? showCard(c) : showHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body></html>
